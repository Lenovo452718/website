services:
  - type: web
    name: streetstore-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: API_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WEBSITE_URL
        value: https://lenovo452718.github.io
      - key: CLOUDINARY_URL
        sync: false
