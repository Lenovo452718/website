<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Order Confirmed — StreetStore</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="rtl.css" />
  <style>
    @media (max-width: 768px) {
      .thankyou-wrap { padding: 40px 20px; align-items: flex-start; }
      .thankyou-inner { padding-bottom: 80px; }
      .thankyou-inner h1 { font-size: clamp(36px, 10vw, 64px); margin-bottom: 10px; }
      .thankyou-inner .subheading { font-size: 16px; margin-bottom: 14px; }
      .thankyou-inner .order-msg { font-size: 14px; }
      .thankyou-inner .delivery-msg { font-size: 13px; margin-bottom: 28px; }
      .thankyou-check { width: 68px; height: 68px; font-size: 30px; margin-bottom: 24px; }
      .thankyou-summary { padding: 20px; margin-bottom: 24px; }
      .thankyou-item { font-size: 13px; gap: 8px; flex-wrap: wrap; }
      .thankyou-item span:last-child { font-weight: 600; color: var(--charcoal); }
      .thankyou-total { font-size: 15px; }
      .thankyou-btns { flex-direction: column; gap: 10px; }
      .thankyou-btns a { width: 100%; text-align: center; padding: 14px 20px; }
      .thankyou-footer { padding: 16px 20px; gap: 12px; justify-content: center; }
      .thankyou-footer a { font-size: 12px; }
    }
    @media (max-width: 360px) {
      .thankyou-wrap { padding: 28px 14px; }
      .thankyou-check { width: 56px; height: 56px; font-size: 24px; }
      .thankyou-inner h1 { font-size: clamp(28px, 9vw, 48px); }
    }
  </style>
</head>
<body>

<!-- ===== MINIMAL HEADER ===== -->
<header class="checkout-header">
  <a href="index.html" class="checkout-logo">STREETSTORE</a>
</header>

<!-- ===== THANK YOU CONTENT ===== -->
<div class="thankyou-wrap">
  <div class="thankyou-inner">
    <div class="thankyou-check">✓</div>
    <h1 data-i18n="order_confirmed">Order Confirmed!</h1>
    <p class="subheading" id="tyGreeting" data-i18n="order_confirmed"></p>
    <p class="order-msg" data-i18n="order_confirmed_sub">Your order has been placed successfully. Our team will contact you before delivery.</p>
    <p class="delivery-msg" data-i18n="order_est_delivery">Estimated delivery: 3–5 business days</p>

    <div class="thankyou-summary" id="tySummary"></div>

    <div class="thankyou-btns">
      <a href="shipping.html" class="btn-outline-dark" data-i18n="shipping_info">Shipping Info</a>
      <a href="shop.html" class="btn-dark" data-i18n="continue_shopping_btn">Continue Shopping</a>
    </div>
  </div>
</div>

<!-- ===== FOOTER BAR ===== -->
<div class="thankyou-footer">
  <a href="https://www.instagram.com/streetstore1994?igsh=MW5kaW9mZ2VreThhcg%3D%3D&utm_source=qr" target="_blank">Instagram</a>
  <a href="https://www.tiktok.com/@streetstore04" target="_blank">TikTok</a>
  <a href="contact.html" data-i18n="footer_contact">Contact Us</a>
  <a href="faq.html" data-i18n="footer_faq">FAQ</a>
</div>

<script src="products.js"></script>
<script src="lang.js"></script>
<script src="i18n.js"></script>
<script src="script.js"></script>
<script src="mobile.js"></script>
<script>
  // Read last order from localStorage and render
  (function() {
    const order = JSON.parse(localStorage.getItem('streetstore_last_order') || '[]');
    const container = document.getElementById('tySummary');
    if (!container) return;

    if (!order.length) {
      container.style.display = 'none';
      return;
    }

    const subtotal = order.reduce((s, i) => s + i.price * i.qty, 0);
    const totalQty = order.reduce((s, i) => s + i.qty, 0);
    const discount = totalQty >= 2 ? Math.round(subtotal * 39 / 358) : 0;
    const total = subtotal - discount;

    const itemsHtml = order.map(item => `
      <div class="thankyou-item">
        <span>${item.name} × ${item.qty} (Size ${item.size})</span>
        <span>${item.price * item.qty} MAD</span>
      </div>
    `).join('');

    const discountHtml = discount > 0 ? `
      <div class="thankyou-deal-badge">
        <span class="thankyou-deal-check">✓</span>
        <span>${t('deal_applied_pre')} <strong>${discount} MAD</strong>${t('deal_applied_suf')}</span>
      </div>
      <div class="thankyou-row thankyou-discount-row">
        <span>${t('discount_label')}</span><span>−${discount} MAD</span>
      </div>
    ` : '';

    container.innerHTML = `
      <h3>${t('order_summary')}</h3>
      ${itemsHtml}
      <div class="thankyou-row" style="border-top:1px solid var(--gray-light);margin-top:8px;padding-top:10px;">
        <span>${t('subtotal')}</span><span>${subtotal} MAD</span>
      </div>
      ${discountHtml}
      <div class="thankyou-row">
        <span>${t('shipping_label')}</span><span>${t('free')}</span>
      </div>
      <div class="thankyou-total">
        <span>${t('total_label')}</span>
        <span>${total} MAD</span>
      </div>
    `;
  })();
</script>
</body>
</html>
