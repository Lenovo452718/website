<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed — StreetStore</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="rtl.css" />
</head>
<body>

<!-- ===== MINIMAL HEADER ===== -->
<header class="checkout-header">
  <a href="index.html" class="checkout-logo">STREETSTORE</a>
</header>

<!-- ===== THANK YOU CONTENT ===== -->
<div class="thankyou-wrap">
  <div class="thankyou-inner">
    <div class="thankyou-check">✓</div>
    <h1 data-i18n="order_confirmed">Order Confirmed!</h1>
    <p class="subheading" id="tyGreeting">Thank you for your order!</p>
    <p class="order-msg">Your order has been placed successfully. Our team will contact you before delivery.</p>
    <p class="delivery-msg">Estimated delivery: <strong>3–5 business days</strong></p>

    <div class="thankyou-summary" id="tySummary"></div>

    <div class="thankyou-btns">
      <a href="shipping.html" class="btn-outline-dark">Shipping Info</a>
      <a href="shop.html" class="btn-dark">Continue Shopping</a>
    </div>
  </div>
</div>

<!-- ===== FOOTER BAR ===== -->
<div class="thankyou-footer">
  <a href="https://www.instagram.com/streetstore1994?igsh=MW5kaW9mZ2VreThhcg%3D%3D&utm_source=qr" target="_blank">Instagram</a>
  <a href="https://www.tiktok.com/@streetstore04" target="_blank">TikTok</a>
  <a href="contact.html" data-i18n="footer_contact">Contact Us</a>
  <a href="faq.html" data-i18n="footer_faq">FAQ</a>
</div>

<script src="products.js"></script>
<script src="lang.js"></script>
<script src="i18n.js"></script>
<script src="script.js"></script>
<script>
  // Read last order from localStorage and render
  (function() {
    const order = JSON.parse(localStorage.getItem('streetstore_last_order') || '[]');
    const container = document.getElementById('tySummary');
    if (!container) return;

    if (!order.length) {
      container.style.display = 'none';
      return;
    }

    const subtotal = order.reduce((s, i) => s + i.price * i.qty, 0);
    const itemsHtml = order.map(item => `
      <div class="thankyou-item">
        <span>${item.name} × ${item.qty} (Size ${item.size})</span>
        <span>${item.price * item.qty} MAD</span>
      </div>
    `).join('');

    container.innerHTML = `
      <h3>Order Summary</h3>
      ${itemsHtml}
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--gray);padding:10px 0;border-top:1px solid var(--gray-light);margin-top:8px;">
        <span>Subtotal</span><span>${subtotal} MAD</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--gray);padding:4px 0;">
        <span>Shipping</span><span>Free</span>
      </div>
      <div class="thankyou-total">
        <span>Total</span>
        <span>${subtotal} MAD</span>
      </div>
    `;
  })();
</script>
</body>
</html>
